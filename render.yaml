services:
  - type: web
    name: marketmind-ai
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: gen-lang-client-0282286222
      - key: FIREBASE_DATABASE_ID
        value: ai-studio-marketmindai-52b43fbe-5366-4a57-8a3b-5ac098b91d46
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_BASIC_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM_ANNUAL
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALLOW_SIMULATED_MARKET_DATA
        value: "false"
      - key: MARKET_DATA_MODE
        value: end_of_day
      - key: VITE_MARKET_DATA_MODE
        value: end_of_day
